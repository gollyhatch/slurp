[package]
name = "slurp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A terminal EPUB reader with vim-like keys, full-text search, and images"
license = "MIT"
readme = "README.md"
keywords = ["epub", "tui", "reader", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
dirs = "6"
fuzzy-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
opaline = "0.4"
quick-xml = { version = "0.42", features = ["escape-html"] }
percent-encoding = "2"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
rbook = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
